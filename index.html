<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/faviconEmos.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Título optimizado para el buscador -->
    <title>EMOS - Empresa Municipal de Obras SAU</title>
    
    <!-- Descripción que aparecerá debajo del título en los resultados de Google -->
    <meta 
      name="description" 
      content="Sitio oficial de EMOS (Empresa Municipal de Obras SAU). Información sobre proyectos, obras públicas y servicios municipales." 
    />

    <!-- Idioma y ubicación para reforzar el contexto en Argentina -->
    <meta name="geo.region" content="AR" />

    <!-- Open Graph (para que se vea bien cuando compartan el link por WhatsApp o redes sociales) -->
    <meta property="og:title" content="EMOS - Empresa Municipal de Obras SAU" />
    <meta property="og:description" content="Sitio oficial de EMOS (Empresa Municipal de Obras SAU). Proyectos, contrataciones y obras públicas." />
    <meta property="og:url" content="https://emossau.com.ar/" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
